          {g:28,h:'8h',f:'Favini',n:''},
        ],
        oreLavorate:{Favini:'142h',Permesso:'45h'}
      };
      function loadData(){
        try{
          const s=localStorage.getItem(KEY);
          if(s){return JSON.parse(s);}
        }catch{}
        return DEFAULT_DATA;
      }
      function saveData(d){
        try{localStorage.setItem(KEY,JSON.stringify(d));}catch{}

      function render(d){
        const root=document.getElementById('root');
        const rows=d.dettaglio.map(r=>{
          const cls=r.evidenza?' class="day-naranja"':'';
          const badge=r.evidenza?'<span class="badge badge-orange">● NARANJA • Día 23</span>':'';

        }).join('');
        root.innerHTML=`
        <div class="app">
          <div class="top">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="width:36px;height:36px;border-radius:10px;background:#1e1b18;color:#fff;display:grid;place-items:center;font-weight:800">B</div>

          </div>
          <div class="grid4">

            <div class="kpi dark"><div class="lbl">Totale</div><div class="val">${d.totale}</div><div class="mono" style="font-size:11px;color:#a8a19a">20 giorni • 187h • Ott 2026</div></div>

            <div class="kpi"><div class="lbl">Mese</div><div class="val" style="font-size:18px">${d.mese}</div><div class="mono" style="font-size:11px;color:#8a8178">L 0h → 187h fix</div></div>

            <div style="display:flex;flex-direction:column;gap:14px">

        document.getElementById('importFile').addEventListener('change',function(e){
          const file=e.target.files&&e.target.files[0];
          if(!file)return;
          if(!file.name.toLowerCase().endsWith('.json')){alert('Solo JSON');return;}
          const r=new FileReader();
          r.onload=function(ev){
            try{
              const data=JSON.parse(ev.target.result);
              localStorage.setItem(KEY,ev.target.result);
              localStorage.setItem(KEY_NAME,file.name);
              render(data.fabbriche?data:DEFAULT_DATA);
            }catch(err){alert('JSON inválido');}
          };
          r.readAsText(file);
        });

      window.exportJSON=function(){
        const s=localStorage.getItem(KEY)||JSON.stringify(loadData(),null,2);

<script id="v10-final-permanente">
(function(){
  const KEY='busta_v99_final_187h_permanente';
  const KEY_NAME='busta_v99_final_187h_name';
  document.addEventListener('change',function(e){
    if(e.target.type==='file'&&e.target.files&&e.target.files[0]){
      const file=e.target.files[0];
      if(file.name.toLowerCase().endsWith('.json')){
        const r=new FileReader();
        r.onload=function(ev){try{localStorage.setItem(KEY,ev.target.result);localStorage.setItem(KEY_NAME,file.name);}catch{}};
        r.readAsText(file);
      }
    }
  },true);
  function autoRestore(){
    const s=localStorage.getItem(KEY);if(!s)return;
    const t=document.body.innerText||'';
    if(t.includes('Nessuna fabbrica')||t.includes('Nessun dato')||t.includes('Benvenuto!')||t.includes('0h (L 0h')){
      const b=new Blob([s],{type:'application/json'});
      const f=new File([b],localStorage.getItem(KEY_NAME)||'memoria.json',{type:'application/json'});
      const i=document.querySelector('input[type=file]');
      if(i){const d=new DataTransfer();d.items.add(f);i.files=d.files;i.dispatchEvent(new Event('change',{bubbles:true}));}
    }
  }
  window.addEventListener('load',()=>{setTimeout(autoRestore,1200);setTimeout(autoRestore,3000);});
})();
